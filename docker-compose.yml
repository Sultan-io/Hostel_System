version: '3.9'
services:
  postgres:
    image: postgres:18
    container_name: hostel-postgres
    environment:
      POSTGRES_DB: HostelManagementSystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/sql
    restart: unless-stopped

volumes:
  postgres_data:
